<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Discover Nearby Products — NearZo</title>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
        <link rel="stylesheet" href="/style/style-home.css">
    </head>

    <body>
        <header id="header" class="navbar"></header>
        <script src="/scripts/header.js"></script>

        <main class="products-page">
            <section class="products-header"> 
                <div>
                    <span><i class="fa-solid fa-store"></i> Verified Local Inventories</span>
                    <h2>Discover In-Stock Products Near You</h2>
                    <p style="color: #64748b; font-size: 15px; margin-top: 6px;">Browse real-time items available at neighborhood shops right now.</p>
                </div>
            </section>
            
            <!-- Working Search Bar -->
            <div class="products-toolbar">
                <form class="hero-search" id="productSearchForm">
                    <span class="search-symbol"><i class="fa-solid fa-magnifying-glass"></i></span>
                    <input type="text" id="productSearchInput" name="search" placeholder="Search by product name, brand, category, or store...">
                    <button type="submit"><i class="fa-solid fa-arrow-right"></i> Search</button>
                </form>
                <div class="product-count-badge" id="productCountBadge">Loading products...</div>
            </div>
                        
            <!-- Products Grid Display -->
            <section>
                <div id="productsGrid" class="products-grid"></div>
                <div id="noProductsFound" class="empty-state" style="display: none;">
                    <i class="fa-solid fa-box-open empty-state-icon"></i>
                    <h3>No matching products found</h3>
                    <p id="emptyStateMsg">We couldn't find any local products matching your search query.</p>
                    <button type="button" class="empty-state-btn" id="btnResetSearch">
                        <i class="fa-solid fa-rotate-left"></i> View All Products
                    </button>
                </div>
            </section>
        </main>

        <script>
            document.addEventListener("DOMContentLoaded", async () => {
                const gridContainer = document.getElementById("productsGrid");
                const emptyContainer = document.getElementById("noProductsFound");
                const searchInput = document.getElementById("productSearchInput");
                const searchForm = document.getElementById("productSearchForm");
                const countBadge = document.getElementById("productCountBadge");
                const btnReset = document.getElementById("btnResetSearch");

                let allProducts = [];

                function escapeHtml(str) {
                    if (!str) return '';
                    return String(str)
                        .replace(/&/g, '&amp;')
                        .replace(/</g, '&lt;')
                        .replace(/>/g, '&gt;')
                        .replace(/"/g, '&quot;')
                        .replace(/'/g, '&#039;');
                }

                function renderProducts(productsList, activeQuery = '') {
                    if (!productsList || productsList.length === 0) {
                        gridContainer.style.display = "none";
                        emptyContainer.style.display = "flex";
                        countBadge.textContent = "0 products found";
                        return;
                    }

                    emptyContainer.style.display = "none";
                    gridContainer.style.display = "grid";
                    countBadge.textContent = `${productsList.length} in-stock product${productsList.length === 1 ? '' : 's'}${activeQuery ? ` for "${activeQuery}"` : ''}`;

                    gridContainer.innerHTML = productsList.map(product => {
                        const name = product.customProduct?.name || product.name || 'Unnamed Product';
                        const desc = product.customProduct?.description || product.description || 'Available at local verified store.';
                        const rawPrice = product.price || 40;
                        const formattedPrice = Number(rawPrice).toLocaleString('en-IN');
                        const storeName = product.store_name || 'Verified Local Partner';
                        const storeLocation = product.store_location || 'Neighborhood Market';
                        const availability = product.availability || product.stock || 'In Stock';

                        let badgeClass = "badge-in-stock";
                        if (availability === "Low Stock") {
                            badgeClass = "badge-low-stock";
                        } else if (availability === "Out of Stock") {
                            badgeClass = "badge-out-of-stock";
                        }

                        // Get image URL
                        let imageUrl = '';
                        const images = product.customProduct?.images || product.images || [];
                        if (images.length > 0 && images[0].path) {
                            const p = images[0].path.replace(/\\/g, '/');
                            imageUrl = `http://localhost:3000/${p.startsWith('/') ? p.slice(1) : p}`;
                        } else if (product.imageUrl) {
                            imageUrl = product.imageUrl;
                        }

                        const imageTag = imageUrl
                            ? `<img src="${escapeHtml(imageUrl)}" alt="${escapeHtml(name)}" class="product-img" onerror="this.src='https://images.unsplash.com/photo-1544816155-12df9643f363?auto=format&fit=crop&w=400&q=80';">`
                            : `<img src="https://images.unsplash.com/photo-1544816155-12df9643f363?auto=format&fit=crop&w=400&q=80" alt="Product" class="product-img">`;

                        return `
                            <article class="product-card" onclick="window.location.href='/productListing/${product.id}'">
                                <div class="product-img-wrapper">
                                    ${imageTag}
                                </div>
                                <div class="product-info">
                                    <div class="product-meta-top">
                                        <span class="stock-badge ${badgeClass}"><i class="fa-solid fa-circle-check"></i> ${escapeHtml(availability)}</span>
                                    </div>
                                    <h3 class="product-title">${escapeHtml(name)}</h3>
                                    <p class="product-desc">${escapeHtml(desc)}</p>
                                    
                                    <div class="product-price-row">
                                        <span class="product-price">₹${formattedPrice}</span>
                                    </div>
                                    
                                    <hr class="card-divider" />
                                    
                                    <div class="product-footer">
                                        <div class="store-row">
                                            <i class="fa-solid fa-store icon-store"></i>
                                            <span class="store-name">${escapeHtml(storeName)}</span>
                                        </div>
                                        <div class="location-row">
                                            <i class="fa-solid fa-location-dot icon-location"></i>
                                            <span class="store-location">${escapeHtml(storeLocation)}</span>
                                        </div>
                                    </div>
                                </div>
                            </article>
                        `;
                    }).join('');
                }

                function filterProducts(query) {
                    const q = (query || '').trim().toLowerCase();
                    if (!q) {
                        renderProducts(allProducts);
                        return;
                    }
                    const filtered = allProducts.filter(p => {
                        const name = (p.customProduct?.name || p.name || '').toLowerCase();
                        const desc = (p.customProduct?.description || p.description || '').toLowerCase();
                        const store = (p.store_name || '').toLowerCase();
                        const category = (p.category || '').toLowerCase();
                        return name.includes(q) || desc.includes(q) || store.includes(q) || category.includes(q);
                    });
                    renderProducts(filtered, query);
                }

                try {
                    const response = await fetch("http://localhost:3000/products", { method: "GET" });
                    if (!response.ok) throw new Error("Could not fetch products");
                    allProducts = await response.json();

                    // Check for URL query parameter ?search= or ?q=
                    const urlParams = new URLSearchParams(window.location.search);
                    const initialQuery = urlParams.get('search') || urlParams.get('q') || '';
                    if (initialQuery) {
                        searchInput.value = initialQuery;
                        filterProducts(initialQuery);
                    } else {
                        renderProducts(allProducts);
                    }
                } catch (error) {
                    countBadge.textContent = "Unable to connect to product catalog";
                    console.error("Product load error:", error);
                }

                // Live search input handling
                if (searchInput) {
                    searchInput.addEventListener('input', (e) => {
                        filterProducts(e.target.value);
                    });
                }

                if (searchForm) {
                    searchForm.addEventListener('submit', (e) => {
                        e.preventDefault();
                        filterProducts(searchInput.value);
                    });
                }

                if (btnReset) {
                    btnReset.addEventListener('click', () => {
                        searchInput.value = '';
                        filterProducts('');
                    });
                }
            });
        </script>
    </body>
</html>
