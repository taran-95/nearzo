<!DOCTYPE html>
<html>
    <head>
        <title>Products — NearZo</title>
        <link rel="stylesheet" href="/style/style-home.css">
    </head>

    <body>
        <header id="header" class="navbar"></header>
        <script src="/scripts/header.js"></script>

        <main class="products-page">
            <section class="products-header"> 
                <div>
                <span>Find the products here.</span>
                <h2>Discover products near you.</h2></div>
            </section>
            
            <!-- search bar -->
            <form class="hero-search" action="" id="">
                <span class="search-symbol">⌕</span>
                <input type="text" name="search" placeholder="Search for a product...">
                <button type="submit"> Search</button>
            </form>
            </div>
                        
            
            <!-- products display -->
            <section>
                <div id="productsGrid" class="products-grid"></div> 
            </section>

        </main>
        <script>
            document.addEventListener("DOMContentLoaded", async () => {
                try {
                    const gridContainer = document.getElementById("productsGrid");
                    if (!gridContainer) {
                        throw new Error("Error loading page");
                    };

                    const response = await fetch("http://localhost:3000/products", {method: "GET"});

                    if (!response.ok) {
                        const error = await response.json();
                        throw new Error(error.message);
                    }

                    const products = await response.json();

                    // no product, no error value throw till now just error return 
                    if (products.length === 0) {
                        gridContainer.style.display = "none";
                        return;
                    }

                    gridContainer.style.display = "grid";

                    gridContainer.innerHTML = products.map(product => {
    let badgeClass = "badge-in-stock";
    if (product.availability === "Low Stock") {
        badgeClass = "badge-low-stock";
    } else if (product.availability === "Out of Stock") {
        badgeClass = "badge-out-of-stock";
    }

    const formattedPrice = Number(product.price).toLocaleString('en-IN');

    // Generate HTML for all images in the product
    const imagesHtml = product.images && product.images.length > 0
        ? product.images.map(img => `
            <img src="http://localhost:3000/${img.path}" alt="${product.name}" class="product-img">`).join('')
        : `<img src="http://localhost:3000/placeholder.png" alt="No image available" class="product-img">`;

                        return `
                            <article class="product-card">
                                <div class="product-img-wrapper">
                                    ${imagesHtml}
                                </div>
                                <div class="product-info">
                                    <span class="stock-badge ${badgeClass}">${product.availability}</span>
                                    <h3 class="product-title">${product.name}</h3>
                                    <p class="product-desc">${product.description}</p>
                                    
                                    <div class="product-price-row">
                                        <span class="product-price">₹${formattedPrice}</span>
                                    </div>
                                    
                                    <hr class="card-divider" />
                                    
                                    <div class="product-footer">
                                        <span class="store-name">${product.store_name}</span>
                                        <span class="store-location"><span class="pin">Location:</span> ${product.store_location}</span>
                                    </div>
                                </div>
                            </article>
                            <hr><br><br><br><hr>
                        `;
                    }).join('');
                } catch (error) {
                    alert(error.message);
                }
            });
        </script>
    </body>
</html>
