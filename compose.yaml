services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: nearzo_app

    ports:
      - "3000:3000"

    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
      - ./uploads:/usr/src/app/uploads

    env_file:
      - .env
    
    environment:
      NODE_ENV: development

    depends_on:
      postgres:
        condition: service_healthy

    command: npm run start:dev
  
  postgres:
    image: postgres:18

    ports:
      - "5432:5432"

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nearzo

    volumes:
      - postgres_data:/var/lib/postgresql
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nearzo"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: