<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    
    <link href="https://fonts.googleapis.com/css2?family=Bitcount+Ink:wght@100..900&family=Rubik+Spray+Paint&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style/style-auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <title>NearZo Login</title>
</head>
<body>

    <header id="header" class="navbar"></header>
	<script src="/scripts/header.js"></script>
    <script src="/scripts/auth_guard.js"></script>
    <script>
        requireLoggedOut();
    </script>

    <div class="circle"></div>

    <div class="login-box">
        <form method="POST" id="buisnessLoginForm">
            <div class="icon-box">
                <i class="fa-solid fa-arrow-right-to-bracket"></i>
            </div>

            <h1>Sign in with email</h1>

            <p class="text">Enter Login details here<br></p>

            <div class="input">
                <i class="fa-solid fa-envelope"></i>
                <input type="email" placeholder="Email" id="email">
            </div>

            <div class="input">
                <i class="fa-solid fa-lock"></i>
                <input type="password" placeholder="Password" id="password">
                <i class="fa-solid fa-eye-slash show"></i>
            </div>

            <div class="link"><a href="/auth/buisnessRegister.html">Forgot password?</a></div>
            <div class="error" id="error-div"></div>
            <button class="btn" >Get Started</button>
        </form>
    </div>

    <script>
        const form = document.getElementById("buisnessLoginForm");
        const errorDiv = document.getElementById("error-div");

        form.addEventListener("submit", async function(e) {
            e.preventDefault();

            const data = {
                email: document.getElementById('email').value,
                password: document.getElementById('password').value
            };

            try {
                const response = await fetch('http://localhost:3000/auth/login/shop', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                credentials: 'include',
                body: JSON.stringify(data)
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.message);
                }

                errorDiv.textContent = "Login Successful. Redirecting...";
                errorDiv.style.color = "Green";
                setTimeout(() => {window.location.href = "/";}, 2000);
            } catch (error) {
                errorDiv.textContent = error.message;
            }
        });
    </script>

</body>
</html>
