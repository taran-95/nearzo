<!DOCTYPE html>
<html>
	<head>
		<link rel="stylesheet" href="/style/style-home.css">
		<link rel="stylesheet" href="/style/style-auth.css">
		<title>NearZo Just Search it-up</title>
	</head>

	<body class="uploadbody">
		<header id="header" class="navbar"></header>
		<script src="/scripts/header.js"></script>
		<script src="/scripts/auth_guard.js"></script>
		<script>
			requireLogin();
			requireUserTypeShop();
		</script>

		<main class="upload-page">
			<div class="upload-heading"><h1>List Your Products</h1></div>

			<div class="upload-layout">
				<section class="upload-card">
					<h2 id="productNameH2"></h2>
					<p>Enter your offer details below.</p>

					<form class="uploadForm" method="POST">
						
						<label>Price</label>
						<span>₹</span>
						<input type="number" id="productPrice" placeholder="₹899" required><br>

						<label>Quantity</label>
						<input type="number" id="productQuantity" placeholder="e.g. 50" required><br>

						<label>Search Keywords</label>
						<input type="text" id="searchKeywords" placeholder="e.g. phone, smartphone, apple, iphone (seperate by ,)" required><br>
			
						<!--
						<label>Availability</label>
						<select id="productAvailablity">
							<option value="In Stock">In Stock</option>
							<option value="Low Stock">Low Stock</option>
							<option value="Out of Stock">Out of Stock</option>
						</select><br>
						-->

						<div class="error" id="error-div"></div>
						<button type="submit" class="submit-button">Create Offer</button>
					</form>
				</section>
					
			</div>
		</main>
	<script>
		const params = new URLSearchParams(window.location.search);
		const productId = parseInt(params.get('productId'), 10);

		if (!productId || Number.isNaN(productId)) {
			window.location.href = '/products/uploadProduct'
		}

		document.addEventListener("DOMContentLoaded", async () => {
			const uploadForm = document.querySelector(".uploadForm");
			const imageInput = document.getElementById("productImage");
			const previewContainer = document.getElementById("previewContainer");
			const errorDiv = document.getElementById("error-div");
			const productNameH2 = document.getElementById("productNameH2");

			const productResponse = await fetch(`http://localhost:3000/products/${productId}`, {method: "GET"});
			if(!productResponse.ok) {
				const error = await productResponse.json();
				errorDiv.textContent = error.message;
			}
			const product = await productResponse.json();
			productNameH2.textContent = "Create offer for " + product.customProduct.name;
		
			uploadForm.addEventListener("submit", async function(e) {
				e.preventDefault();
				
				try {
					//restriction price and quantity
					const searchKeywords = document.getElementById('searchKeywords').value.split(/\s*,\s*/);


					const body = {
						productId: Number(productId),
						price: Number(document.getElementById("productPrice").value),
						quantity: Number(document.getElementById("productQuantity").value),
						searchKeywords: searchKeywords
					};

					const response = await fetch("http://localhost:3000/offers", {
						method: "POST",
						credentials: "include",
						headers: {
        					"Content-Type": "application/json"
    					},
						body: JSON.stringify(body)
					});

					if(!response.ok) {
						const error = await response.json();
						console.log("hi");
						throw new Error(error.message);
					}

					errorDiv.textContent = "Offer Created Successfully. Redirecting...";
					errorDiv.style.color = "Green";
					setTimeout(() => {window.location.href = "/";}, 2000);
				} catch (error) {
					errorDiv.textContent = error.message;
				}
			});
		});
	</script>
	</body>
</html>
